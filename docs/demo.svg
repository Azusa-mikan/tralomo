<svg xmlns="http://www.w3.org/2000/svg" width="720" height="240" viewBox="0 0 720 240" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', monospace">
  <style>
    .bg { fill: #0d1117; }
    .bar { fill: #161b22; }
    .dot1 { fill: #ff5f56; }
    .dot2 { fill: #ffbd2e; }
    .dot3 { fill: #27c93f; }
    .title { fill: #8b949e; font-size: 12px; }
    .txt { font-size: 15px; fill: #e6edf3; }
    .prompt { fill: #7ee787; }
    .out { fill: #79c0ff; }
    .cursor { fill: #e6edf3; }

    .type1 { animation: type1 12s linear infinite; }
    .type2 { animation: type2 12s linear infinite; }
    .fade1 { animation: fade1 12s linear infinite; }
    .fade2 { animation: fade2 12s linear infinite; }
    .cur   { animation: cur 12s linear infinite, blink 1.06s step-end infinite; }

    @keyframes type1 { 0%   { clip-path: inset(0 100% 0 0); }
                       14%  { clip-path: inset(0 0 0 0); }
                       100% { clip-path: inset(0 0 0 0); } }
    @keyframes type2 { 0%, 28% { clip-path: inset(0 100% 0 0); }
                       50%     { clip-path: inset(0 0 0 0); }
                       100%    { clip-path: inset(0 0 0 0); } }
    @keyframes fade1 { 0%, 17% { opacity: 0; }
                       22%     { opacity: 1; }
                       100%    { opacity: 1; } }
    @keyframes fade2 { 0%, 50% { opacity: 0; }
                       54%     { opacity: 1; }
                       100%    { opacity: 1; } }
    @keyframes cur { 0%      { transform: translate(0px, 0px); }
                     14%     { transform: translate(189px, 0px); }
                     27.99%  { transform: translate(189px, 0px); }
                     28%     { transform: translate(0px, 72px); }
                     50%     { transform: translate(423px, 72px); }
                     100%    { transform: translate(423px, 72px); } }
    @keyframes blink { 0%, 49% { opacity: 1; }
                       50%, 100% { opacity: 0; } }
  </style>

  <clipPath id="card">
    <rect x="0" y="0" width="720" height="240" rx="10" />
  </clipPath>

  <g clip-path="url(#card)">
    <rect class="bg" x="0" y="0" width="720" height="240" />
    <rect class="bar" x="0" y="0" width="720" height="34" />
    <circle class="dot1" cx="20" cy="17" r="6" />
    <circle class="dot2" cx="40" cy="17" r="6" />
    <circle class="dot3" cx="60" cy="17" r="6" />
    <text class="title" x="360" y="21" text-anchor="middle">tralomo</text>

    <text class="txt type1" x="22" y="86" textLength="189" lengthAdjust="spacingAndGlyphs" xml:space="preserve"><tspan class="prompt">$&#160;</tspan><tspan>tralomo hello world</tspan></text>
    <text class="txt out fade1" x="22" y="118" opacity="1">你好世界</text>

    <text class="txt type2" x="22" y="158" textLength="423" lengthAdjust="spacingAndGlyphs" xml:space="preserve"><tspan class="prompt">$&#160;</tspan><tspan>echo "the quick brown fox" | tralomo -t zh-CN</tspan></text>
    <text class="txt out fade2" x="22" y="190" opacity="1">敏捷的棕色狐狸</text>

    <rect class="cursor cur" x="22" y="73" width="9" height="17" transform="translate(423,72)" />
  </g>
</svg>
